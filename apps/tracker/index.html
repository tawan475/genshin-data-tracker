<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      // Theme before first paint: the user's choice, else the OS preference.
      // The public pages (/, /login, /register) are always dark (lib/theme.ts).
      ;(function () {
        var root = document.documentElement
        var pub = /^\/(login|register)?\/?$/.test(location.pathname)
        var dark = pub
        try {
          var t = localStorage.getItem('gdt:theme')
          dark =
            dark ||
            t === 'dark' ||
            (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (_) {}
        if (pub) root.setAttribute('data-public', '')
        if (dark) {
          root.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = pub ? '#0f131f' : '#0f172a'
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Genshin Tracker</title>
    <meta
      name="description"
      content="Track your Genshin Impact inventory over time: snapshots from Irminsul, artifacts, materials and exports."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GI Tracker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    />
    <link rel="preconnect" href="https://static.nanoka.cc" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
