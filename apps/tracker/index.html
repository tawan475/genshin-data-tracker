<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      // The site moved to teyvat.me: the old address (still the API for
      // installed irminsul copies) sends its pages there, path and all. A
      // Redirect Rule on 475.dev does this as a 301 (README); this covers
      // pages a service worker or cache still holds.
      if (location.hostname === 'genshin-tracker.475.dev') {
        location.replace('https://teyvat.me' + location.pathname + location.search + location.hash)
      }
      // Theme before first paint: the user's choice, else the OS preference.
      // The public pages (/, /login, /register) are always dark (lib/theme.ts).
      ;(function () {
        var root = document.documentElement
        var pub = /^\/(login|register)?\/?$/.test(location.pathname)
        var dark = pub
        try {
          var t = localStorage.getItem('gdt:theme')
          dark =
            dark ||
            t === 'dark' ||
            (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (_) {}
        if (pub) root.setAttribute('data-public', '')
        if (dark) {
          root.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = pub ? '#0f131f' : '#0f172a'
        }
      })()
      // Language before first paint (its font stack follows <html lang>): this
      // device's pick, else the browser's. Same rules as i18n/locale.ts.
      ;(function () {
        try {
          var lang = localStorage.getItem('gdt:lang')
          var ours = ['en', 'zh-CN', 'zh-TW', 'ja', 'ko', 'es', 'fr', 'ru', 'th', 'vi', 'de', 'id', 'pt', 'it', 'tr']
          if (ours.indexOf(lang) < 0) {
            lang = 'en'
            var tags =
              navigator.languages && navigator.languages.length
                ? navigator.languages
                : navigator.language
                  ? [navigator.language]
                  : []
            for (var i = 0; i < tags.length; i++) {
              var parts = String(tags[i]).toLowerCase().split(/[-_]/)
              var base = parts[0]
              if (base === 'zh' || base === 'yue') {
                var p = '-' + parts.join('-') + '-'
                lang = /-hant-/.test(p)
                  ? 'zh-TW'
                  : /-hans-/.test(p)
                    ? 'zh-CN'
                    : /-(tw|hk|mo)-/.test(p) || base === 'yue'
                      ? 'zh-TW'
                      : 'zh-CN'
                break
              }
              if (base === 'in') base = 'id'
              if (ours.indexOf(base) >= 0) {
                lang = base
                break
              }
            }
          }
          document.documentElement.lang = lang
        } catch (_) {}
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Teyvat.me</title>
    <meta
      name="description"
      content="Track your Genshin Impact inventory over time: snapshots from Irminsul, artifacts, materials and exports."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Teyvat.me" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    />
    <!-- The game data's IMAGE_HOST (vite.config.ts fills it in). -->
    <link rel="preconnect" href="__IMAGE_ORIGIN__" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
