name: Deploy
# Every push to main (and a game data bump this repository merged itself):
# the CI checks, then the remote D1 migrations, then `wrangler deploy`, in
# that order, as the manual deploy does (a deploy may need a migration; a
# migration never needs the new code). Secrets: GAME_DATA_DEPLOY_KEY (or
# GAME_DATA_TOKEN); CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID are optional
# — without them the checks still run and the deploy steps are skipped with a
# notice: deploy from a machine with wrangler logged in (`pnpm run deploy`
# after `pnpm run db:migrate:remote`, README: Deploying).
#
# The gap icons load from gi-cdn.475.dev: deploy gi-cdn first when a game
# data release adds `hosted` names (its README), or those show initials
# until it is.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to deploy (game-data-bump.yml passes its merge commit)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      # What was pushed, or the merge commit game-data-bump.yml passes (not
      # the commit that run started on).
      ref: ${{ inputs.ref || github.sha }}
    secrets: inherit

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          game-data-deploy-key: ${{ secrets.GAME_DATA_DEPLOY_KEY }}
          game-data-token: ${{ secrets.GAME_DATA_TOKEN }}

      - name: Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets: checks passed, deploy skipped. Deploy with wrangler from a logged-in machine (README: Deploying)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            # A pasted secret easily picks up a line break, spaces or quotes,
            # which Cloudflare rejects as "Invalid format for Authorization
            # header": strip them, and say what the value looks like (length
            # and character set only, never the value).
            clean=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d "\r\n\t \"'")
            echo "::add-mask::$clean"
            charset=no
            if [[ "$clean" =~ ^[A-Za-z0-9_-]+$ ]]; then charset=yes; fi
            echo "API token: ${#clean} characters after trimming (${#CLOUDFLARE_API_TOKEN} stored), letters/digits/_/- only: $charset"
            echo "CLOUDFLARE_API_TOKEN=$clean" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.creds.outputs.enabled == 'true'
        run: pnpm --filter @gdt/tracker db:migrate:remote

      - name: Build
        if: steps.creds.outputs.enabled == 'true'
        run: pnpm --filter @gdt/tracker build-only

      - name: Deploy the Worker
        if: steps.creds.outputs.enabled == 'true'
        working-directory: apps/tracker
        run: pnpm exec wrangler deploy --message "$(git rev-parse --short HEAD) via ${GITHUB_EVENT_NAME}"
